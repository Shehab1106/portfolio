<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  .card {
    width: 1200px; height: 630px; position: relative; overflow: hidden;
    background: linear-gradient(135deg, #101829 0%, #0a0f1e 100%);
    color: #edeef6; font-family: "Manrope", sans-serif;
    padding: 64px 70px; display: flex; flex-direction: column;
  }
  .dots {
    position: absolute; inset: 0;
    background-image: radial-gradient(#59627e 1.6px, transparent 1.6px);
    background-size: 28px 28px; opacity: 0.2;
  }
  .edge { position: absolute; inset: 0; box-shadow: inset 0 0 0 2px rgba(255,255,255,0.05); }
  .top {
    position: relative; display: flex; align-items: center; justify-content: space-between;
    font-family: "JetBrains Mono", monospace;
  }
  .brand { display: flex; align-items: center; gap: 14px; font-size: 26px; font-weight: 600; letter-spacing: -0.01em; }
  .sq { width: 26px; height: 26px; border-radius: 8px; background: linear-gradient(135deg, #8f8cf8, #6d5cf0); }
  .role { font-size: 20px; color: #8a93ad; }
  .h { position: relative; margin-top: 86px; font-size: 82px; font-weight: 800; letter-spacing: -0.035em; line-height: 1.07; }
  .h em { color: #9a97fb; font-style: normal; }
  .bar { position: relative; width: 56px; height: 5px; border-radius: 3px; background: #8f8cf8; margin: 38px 0 26px; }
  .sub { position: relative; font-size: 27px; color: #aeb6cc; letter-spacing: -0.01em; }
  .dom { position: relative; margin-top: 38px; font-family: "JetBrains Mono", monospace; font-size: 24px; color: #9a97fb; }
</style>
</head>
<body>
  <div class="card">
    <div class="dots"></div>
    <div class="edge"></div>
    <div class="top">
      <div class="brand"><span class="sq"></span>shehab sherif</div>
      <div class="role">CTO @ ClearSplit</div>
    </div>
    <div class="h">I build systems where<br>money <em>can't be wrong</em>.</div>
    <div class="bar"></div>
    <div class="sub">Fintech &amp; payments engineering &nbsp;·&nbsp; ledgers, orchestration, reconciliation</div>
    <div class="dom">shehabelsedody.dev</div>
  </div>
</body>
</html>
